name: Push @ Any Branch

on:
  push:
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/on-push.yml"
    # branches-ignore:
    #   - main

jobs:

  static-tests:

    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: 18

      - uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            seeder:
              - 'seeder/**'

      # install root dependencies
      - name: Cache Root Node modules
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      # format command runs prettier and lint
      - name: Format Backend
        if: ${{ steps.filter.outputs.backend == 'true' }}
        run: npm run format:backend

      - name: Format Frontend
        if: ${{ steps.filter.outputs.frontend == 'true' }}
        run: npm run format:frontend

      - name: Format Seeder
        if: ${{ steps.filter.outputs.seeder == 'true' }}
        run: npm run format:seeder

      # backend unit tests
      - name: Cache Backend modules
        if: ${{ steps.filter.outputs.backend == 'true' }}
        uses: actions/cache@v3
        with:
          path: backend/node_modules
          key: ${{ runner.os }}-backend-node-${{ hashFiles('backend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-backend-node-

      - name: Install backend dependencies
        if: ${{ steps.filter.outputs.backend == 'true' }}
        run: cd backend && npm ci

      - name: Run Backend Unit Tests
        if: ${{ steps.filter.outputs.backend == 'true' }}
        run: cd backend && npm test

      # frontend unit tests
      - name: Cache Frontend modules
        if: ${{ steps.filter.outputs.frontend == 'true' }}
        uses: actions/cache@v3
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-frontend-node-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-frontend-node-

      - name: Install frontend dependencies
        if: ${{ steps.filter.outputs.frontend == 'true' }}
        run: cd frontend && npm ci

      - name: Run Unit Tests
        if: ${{ steps.filter.outputs.frontend == 'true' }}
        run: cd frontend && npm test
